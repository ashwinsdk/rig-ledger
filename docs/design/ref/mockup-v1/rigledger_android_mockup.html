<script>
/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var RS='₹';
var TODAY='2026-10-13';
function p2(n){return String(n).padStart(2,'0')}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fEEE(s){var d=pd(s);return DOW[d.getDay()]+', '+p2(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function fDM(s){var d=pd(s);return p2(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function fSl(s){var d=pd(s);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()}
function fCb(s){var d=pd(s);return MON[d.getMonth()]+'-'+p2(d.getDate())+'-'+d.getFullYear()}
function fCbDay(s){var d=pd(s);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+p2(d.getDate())+' '+d.getFullYear()}
function fT(t){var a=t.split(':').map(Number);var h=a[0]%12||12;return p2(h)+':'+p2(a[1])+' '+(a[0]<12?'AM':'PM')}
function grp(n){return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})}
function inr(n){return (n<0?'-':'')+RS+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function inrS(n){return RS+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rs(n){return (n<0?'-':'')+RS+grp(Math.abs(n))}
function rsx(n){return (n<0?'-':'')+'Rs. '+grp(Math.abs(n))}
function num(n){return (n<0?'-':'')+grp(Math.abs(n))}
function cmp(n){n=Math.abs(n);return n>=100000?(n/100000).toFixed(1).replace('.0','')+'L':n>=1000?Math.round(n/1000)+'K':String(Math.round(n))}
function ic(n,s,c){var o=/_outlined$/.test(n);var nm=o?n.slice(0,-9):n;return '<span class="mi'+(o?' o':'')+'" style="font-size:'+(s||24)+'px;'+(c?'color:'+c+';':'')+'">'+nm+'</span>'}
function m2(n){return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function r2(n){return Math.round(n*100)/100}
function sum(a,f){return a.reduce(function(t,x){return t+f(x)},0)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

 {id:'a1',name:'Murugan',phone:'98765 43210',notes:'Salem region',cd:10,cp:5,cm:0,rt:{'depth:7inch':10,'depth:8inch':12,'depth:9inch':14,'pvc:7inch':5,'ms:6inch':3}},
 {id:'a2',name:'Selvam',phone:'98421 77012',notes:'',cd:8,cp:4,cm:0,rt:{'depth:8inch':8,'depth:9inch':12}},

function mkL(b){var L=[{c:'depth',t:b.dt,f:b.d,r:b.dr}];if(b.rig!='side'){L.push({c:'pvc',t:b.pt,f:b.p,r:b.pr});L.push({c:'ms',t:'6inch',f:b.m,r:b.mr})}return L}

function bfeet(b,c){return sum(ofc(b,c),function(l){return l.f})}
function btypes(b,c){var o=[];ofc(b,c).forEach(function(l){if(o.indexOf(l.t)<0)o.push(l.t)});return o}
/* step rate, total and commission rates are stored on the bill when it is created, like the app (later agent or table changes do not touch old bills).

function recompute(){BILLS.forEach(function(b){
 var side=b.rig=='side',a=agent(b.ag);
 if(!b.L)b.L=mkL(b);
 if(b.step==null){
  b.step=side?0:sum(ofc(b,'depth'),function(l){return stepFor(l.t,l.f,b.rig)});
  b.total=sum(b.L,function(l){return l.f*l.r})+b.step+b.ex;
  b.L.forEach(function(l){if(l.cr==null)l.cr=side?(a.cd||0):rateFor(a,l.c,l.t)});
  b.comm=b.man!=null?b.man:sum(b.L,function(l){return l.f*l.cr});
 }
 b.recv=b.cash+b.pp;b.bal=b.total-b.recv-b.less;
})}

 if(!t){LT[c].push(nm);LT[c].sort(function(a,b){return parseFloat(a)-parseFloat(b)})}
