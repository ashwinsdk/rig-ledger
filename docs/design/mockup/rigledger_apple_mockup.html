<style>

@font-face{font-family:'MI Round';src:url(fonts/MaterialIconsRound-Regular.otf) format('opentype');font-display:block}
/* ================= TOKENS (the only place raw colors live) ================= */
:root{
 color-scheme:light;
 --ts:1;--font:Inter,Roboto,system-ui,sans-serif;
 --white:#FFFFFF;--black:#000000;
 --canvas:#F2F2F7;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E5E5EA;--s1e:#FFFFFF;--sheet:#F2F2F7;
 --sep:rgba(60,60,67,.29);--lb:#000000;--lb2:rgba(60,60,67,.8);--lb3:rgba(60,60,67,.3);
 --fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.24);
 --inv-bg:#000000;--inv-tx:#FFFFFF;
 --acc:#007AFF;--acc-tx:#0059B8;--acc-btn:#0062CC;--onacc:#FFFFFF;--acc-tint:rgba(0,122,255,.1);
 --in:#34C759;--in-tx:#1E7434;--in-btn:#1E7434;
 --out:#FF3B30;--out-tx:#BE0A00;--out-btn:#CC0B00;
 --bal:#FF9500;--bal-tx:#945600;
 --com:#AF52DE;--com-tx:#9928D2;
 --dng:var(--out);--dng-tx:var(--out-tx);--wrn:var(--bal);--wrn-tx:var(--bal-tx);
 --c-diesel:#FF9500;--c-diesel-tx:#945600;--c-pvc:#30B0C7;--c-pvc-tx:#1E6F7D;--c-bit:#AF52DE;--c-bit-tx:#9928D2;--c-ham:#FF2D55;--c-ham-tx:#CB0027;--c-oth:#A2845E;--c-oth-tx:#7A5B38;
 --on-tile:#000000;
 --glass:rgba(255,255,255,.72);--glass-bar:rgba(250,250,252,.78);--glass-bd:rgba(255,255,255,.9);--glass-sel:rgba(120,120,128,.12);
 --bar:rgba(242,242,247,.82);
 --alert:rgba(255,255,255,.96);--scrim:rgba(0,0,0,.35);
 --sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);--sh-bar:0 8px 28px rgba(0,0,0,.14);
 --tl-r:#FF5F57;--tl-y:#FEBC2E;--tl-g:#28C840;--bezel:#1A1A1C;--page:#D9DCE3;--panel:#FFFFFF;--panel-tx:#1A1A2E;--panel-bd:#E2E8F0;--panel-mut:#475569;--panel-hov:#F1F5F9;--panel-sel:#315D9A;--panel-seltx:#FFFFFF;
 --sh-knob:0 2px 4px rgba(0,0,0,.25);--sh-pop:0 6px 20px rgba(0,0,0,.3);--sh-dev:0 24px 70px rgba(0,0,0,.35);--sh-win:0 24px 70px rgba(0,0,0,.4);--sep-win:rgba(60,60,67,.29);
 --r:20px;--gap:12px;--mx:20px;--dw:412px;--dh:892px;
 --sbh:28px;--abh:56px;--hdr:calc(var(--sbh) + var(--abh));--inset:24px;--sysb:0px;--kb:0px;--tap:48px;--navh:calc(62px + var(--inset) + 8px + 24px);
 --press:rgba(0,0,0,.08);--press-on:rgba(0,0,0,.2);--kb-bg:#D1D5DB;--kb-key:#FFFFFF;--kb-tx:#1F2937;--sysnav-bg:#F2F2F7;--sysnav-fg:#3C3C43;
 --bar-s:rgba(242,242,247,.94);--glass-bar-s:rgba(250,250,252,.94);
}
:root[data-th=dark]{
 color-scheme:dark;
 --canvas:#000000;--s1:#1C1C1E;--s2:#2C2C2E;--s3:#3A3A3C;--s1e:#2C2C2E;--sheet:#1C1C1E;
 --sep:rgba(84,84,88,.65);--lb:#FFFFFF;--lb2:rgba(235,235,245,.6);--lb3:rgba(235,235,245,.3);
 --fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
 --inv-bg:#FFFFFF;--inv-tx:#000000;
 --acc:#0A84FF;--acc-tx:#4FA3FF;--acc-btn:#0072E5;--onacc:#FFFFFF;--acc-tint:rgba(10,132,255,.2);
 --in:#30D158;--in-tx:#30D158;--in-btn:#1E8537;
 --out:#FF453A;--out-tx:#FF6B63;--out-btn:#EA0D00;
 --bal:#FF9F0A;--bal-tx:#FF9F0A;
 --com:#BF5AF2;--com-tx:#D17FF6;
 --c-diesel:#FF9F0A;--c-diesel-tx:#FF9F0A;--c-pvc:#40C8E0;--c-pvc-tx:#40C8E0;--c-bit:#BF5AF2;--c-bit-tx:#D17FF6;--c-ham:#FF375F;--c-ham-tx:#FF6F8D;--c-oth:#AC8E68;--c-oth-tx:#C4A57C;
 --glass:rgba(58,58,60,.7);--glass-bar:rgba(44,44,46,.66);--glass-bd:rgba(255,255,255,.16);--glass-sel:rgba(10,10,12,.62);
 --bar:rgba(0,0,0,.72);--bar-s:rgba(0,0,0,.94);--glass-bar-s:rgba(44,44,46,.94);--press:rgba(255,255,255,.12);--press-on:rgba(0,0,0,.22);--kb-bg:#202124;--kb-key:#3C4043;--kb-tx:#E8EAED;--sysnav-bg:#000000;--sysnav-fg:#E5E5EA;
 --alert:rgba(44,44,46,.97);--scrim:rgba(0,0,0,.55);
 --sh:none;--sh-bar:0 8px 28px rgba(0,0,0,.5);
}
/* accent options (Dev panel). Default blue is the system accent, brand colour is not ready. */
:root[data-accent=lime]{--acc:#8FD100;--acc-tx:#4D7000;--acc-btn:#8FD100;--onacc:#000000;--acc-tint:rgba(143,209,0,.2)}
:root[data-th=dark][data-accent=lime]{--acc:#C6F73A;--acc-tx:#C6F73A;--acc-btn:#C6F73A;--acc-tint:rgba(198,247,58,.2)}
:root[data-accent=green]{--acc:#34C759;--acc-tx:#1E7434;--acc-btn:#34C759;--onacc:#000000;--acc-tint:rgba(52,199,89,.18)}
:root[data-th=dark][data-accent=green]{--acc:#30D158;--acc-tx:#30D158;--acc-btn:#30D158;--acc-tint:rgba(48,209,88,.2)}
:root[data-accent=brand]{--acc:#315D9A;--acc-tx:#315D9A;--acc-btn:#315D9A;--onacc:#FFFFFF;--acc-tint:rgba(49,93,154,.15)}
:root[data-th=dark][data-accent=brand]{--acc:#6D97D1;--acc-tx:#6D97D1;--acc-btn:#315D9A;--acc-tint:rgba(109,151,209,.2)}
/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--lb);font-size:calc(17px*var(--ts));font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'cv11' 1;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0}
.mi{font-family:'MI Round';font-style:normal;font-weight:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';vertical-align:middle;flex:none}
.t34{font-size:calc(34px*var(--ts));line-height:1.2;font-weight:700;letter-spacing:-.5px}
.t28{font-size:calc(28px*var(--ts));line-height:1.15;font-weight:700;letter-spacing:-.4px}
.t22{font-size:calc(22px*var(--ts));line-height:1.25;font-weight:700;letter-spacing:-.3px}
.t20{font-size:calc(20px*var(--ts));line-height:1.25;font-weight:600}
.t17{font-size:calc(17px*var(--ts));line-height:1.3}
.t15{font-size:calc(15px*var(--ts));line-height:1.3}
.t13{font-size:calc(13px*var(--ts));line-height:1.3}
.t12{font-size:calc(12px*var(--ts));line-height:1.25}
.t11{font-size:calc(11px*var(--ts));line-height:1.2}
.hero{font-size:calc(44px*var(--ts));line-height:1.05;font-weight:700;letter-spacing:-1px}
.b{font-weight:700}.sb6{font-weight:600}.md{font-weight:500}
.l2{color:var(--lb2)}.l3{color:var(--lb3)}.cin{color:var(--in-tx)}.cout{color:var(--out-tx)}.cbal{color:var(--bal-tx)}.ccom{color:var(--com-tx)}.cacc{color:var(--acc-tx)}.cdng{color:var(--dng-tx)}
.row{display:flex;align-items:center}.sp{flex:1;min-width:0}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.wrap{flex-wrap:wrap}.tr{text-align:right}.tc{text-align:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ================= PAGE (dev panel + stage) ================= */
#side{width:276px;background:var(--panel);color:var(--panel-tx);border-right:1px solid var(--panel-bd);height:100vh;overflow:auto;padding:12px 10px;flex:none;position:sticky;top:0;font-size:12.5px;font-variant-numeric:normal}
#side h1{font-size:15px;margin:2px 6px 2px}#side .sub{font-size:11.5px;color:var(--panel-mut);margin:0 6px 8px}
#side h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--panel-mut);margin:12px 6px 4px}
#side button{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--panel-tx)}
#side button:hover{background:var(--panel-hov)}#side button.on{background:var(--panel-sel);color:var(--panel-seltx)}
#side .dv{display:flex;flex-wrap:wrap;gap:4px;margin:0 4px 6px}#side .dv button{width:auto;border:1px solid var(--panel-bd);padding:4px 9px}
#side .dv button.on{border-color:var(--panel-sel)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;overflow:auto}
#phone{width:calc(var(--dw) + 16px);height:calc(var(--dh) + 16px);flex:none;background:var(--canvas);color:var(--lb);border-radius:30px;border:8px solid var(--bezel);position:relative;overflow:hidden;box-shadow:var(--sh-dev);isolation:isolate}
#phone.fsopen #sb{color:var(--white)}
#sb{position:absolute;top:0;left:0;right:0;height:var(--sbh);z-index:40;display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none;font-size:13px;font-weight:500}
#sb .ic{display:flex;gap:5px;align-items:center}
#screen{position:absolute;top:0;left:0;right:0;bottom:calc(var(--sysb) + var(--kb));overflow:hidden}
#phone.kbd{--inset:0px;--kb:300px}
#phone.kbd #nav{display:none!important}
@media(max-width:760px){#side{display:none}}
/* ================= SCREEN SHELL ================= */
.scr{position:absolute;inset:0;background:var(--canvas)}
.scc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--navh);scrollbar-width:none;overscroll-behavior:contain}
.scc::-webkit-scrollbar{display:none}
.scr.push .scc{padding-bottom:calc(var(--inset) + 24px)}
.scr.hasbot .scc{padding-bottom:calc(var(--inset) + 110px)}
.nb{position:absolute;top:0;left:0;right:0;height:var(--hdr);padding:var(--sbh) 12px 0;display:flex;align-items:center;justify-content:space-between;z-index:30;pointer-events:none}
.nb>*{pointer-events:auto}
.nb::before{content:"";position:absolute;inset:0;background:var(--bar-s);box-shadow:0 .5px 0 var(--sep);opacity:0;transition:opacity .2s ease-out;pointer-events:none}
.scr.col .nb::before{opacity:1}
body.blur .scr.col .nb::before{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
.nbt{position:absolute;left:70px;right:70px;top:var(--sbh);height:var(--abh);display:flex;align-items:center;justify-content:center;font-size:calc(17px*var(--ts));font-weight:600;opacity:0;transition:opacity .2s ease-out;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scr.col .nbt{opacity:1}
.nbr{display:flex;gap:10px;position:relative}
.nbl{position:relative}
.gl{width:var(--tap);height:var(--tap);border-radius:24px;background:var(--glass);border:1px solid var(--glass-bd);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.gl .mi{font-size:calc(22px*var(--ts))}
.gl .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:5px;background:var(--bal)}
.lt{padding:var(--sbh) var(--mx) 0;height:var(--hdr);display:flex;align-items:center}
.lt.push{padding-top:var(--hdr);height:auto;align-items:flex-start;padding-bottom:6px}
.lt h1{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:min(calc(34px*var(--ts)),46px)}
.lt.push h1{white-space:normal;overflow-wrap:anywhere}
.lt.root h1{max-width:calc(100% - 150px)}
.sec{padding:20px var(--mx) 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec .t22{letter-spacing:-.3px}
.foot{padding:8px calc(var(--mx) + 16px) 4px;color:var(--lb2)}
/* floating tab bar */
#nav{position:absolute;bottom:calc(var(--sysb) + var(--inset) + 8px);left:16px;right:16px;height:62px;border-radius:31px;background:var(--glass-bar-s);border:1px solid var(--sep);box-shadow:var(--sh-bar);display:flex;padding:4px;z-index:35}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border-radius:27px;color:var(--lb2);font-size:min(calc(11px*var(--ts)),13px);font-weight:500;min-width:var(--tap);overflow:hidden}
#nav button .mi{font-size:min(calc(26px*var(--ts)),30px)!important}
#nav button.on{color:var(--acc-tx);background:var(--glass-sel)}
#ov{position:absolute;top:0;left:0;right:0;bottom:calc(var(--sysb) + var(--kb));pointer-events:none;z-index:60}
#ov>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
body.blur #nav{background:var(--glass-bar);border-color:var(--glass-bd);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
body.blur #phone.ovo .scr.col .nb::before,body.blur #phone.ovo #nav{-webkit-backdrop-filter:none;backdrop-filter:none}
body.blur #phone.ovo .scrim{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sysb) + var(--inset) + 82px);max-width:360px;padding:13px 20px;border-radius:26px;background:var(--lb);color:var(--inv-tx);z-index:70;font-size:calc(15px*var(--ts));font-weight:500;animation:rise .25s ease-out;text-align:center}
/* sheets */
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);--s1:var(--s1e);border-radius:28px 28px 0 0;max-height:92%;display:flex;flex-direction:column;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sh.full{top:12px;max-height:none}
.gr{width:36px;height:5px;border-radius:3px;background:var(--lb3);margin:8px auto 4px;flex:none}
.shh{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 6px;min-height:56px;flex:none;gap:8px}
.shh .t{font-size:calc(17px*var(--ts));font-weight:600;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .shb{overflow-y:auto;flex:1;padding-bottom:calc(var(--inset) + 16px);scroll-padding:16px 0 120px;scrollbar-width:none}
.sh .shb::-webkit-scrollbar{display:none}
.shbot{padding:10px var(--mx) calc(var(--inset) + 10px);background:var(--sheet);flex:none}
/* alerts */
.alw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 20px}
.al{width:270px;background:var(--alert);border-radius:14px;overflow:hidden;animation:pop .22s ease-out;text-align:center}
.al .ab{padding:20px 16px 18px}
.al .ab b{display:block;font-size:calc(17px*var(--ts));font-weight:600;line-height:1.3}
.al .ab div{font-size:calc(13px*var(--ts));margin-top:4px;line-height:1.35}
.al button{display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--tap);border-top:.5px solid var(--sep);color:var(--acc-tx);font-size:calc(17px*var(--ts));text-align:center}
.al button.def{font-weight:600}.al button.des{color:var(--out-tx)}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px);opacity:0}}@keyframes pop{from{transform:scale(1.08);opacity:0}}
@keyframes ring{from{stroke-dashoffset:var(--full)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes sk{to{background-position:-200% 0}}
/* ================= SURFACES ================= */
.card{background:var(--s1);border-radius:var(--r);margin:0 var(--mx) var(--gap);padding:16px;box-shadow:var(--sh);position:relative}
.card.tap{cursor:pointer}
.grp{background:var(--s1);border-radius:var(--r);margin:0 var(--mx) var(--gap);overflow:hidden;box-shadow:var(--sh)}
.ri{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;position:relative;width:100%;cursor:pointer}
.grp>*+*{position:relative}
.grp>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep);z-index:1}
.grp>.ico+.ico::before{left:58px}
.ri .tt{flex:1;min-width:0}
.ri .tt b{display:block;font-weight:400}
.ri .tt small{display:block;color:var(--lb2);font-size:calc(13px*var(--ts));margin-top:1px}
.ri .chev{color:var(--lb3);font-size:calc(20px*var(--ts))}
.ri.des .tt b,.ri.des .mi.lead{color:var(--out-tx)}
.itile{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acc);color:var(--white)}
.itile .mi{font-size:19px}
.gh{position:sticky;top:var(--hdr);z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:10px var(--mx) 6px;background:var(--canvas);font-size:calc(15px*var(--ts));font-weight:600;color:var(--lb2)}
.avatar{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:calc(17px*var(--ts));flex:none;background:var(--acc-tint);color:var(--acc-tx)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:calc(12px*var(--ts));font-weight:600;background:var(--acc-tint);color:var(--acc-tx)}
/* pills, chips, segments */
.pillb{display:inline-flex;align-items:center;gap:6px;height:var(--tap);margin:0 var(--mx) 4px;padding:0 14px;border-radius:24px;background:var(--fill);font-size:calc(15px*var(--ts));font-weight:500;max-width:calc(100% - 40px)}
.pillb .mi{font-size:calc(18px*var(--ts));color:var(--lb2)}
.chips{display:flex;gap:0;overflow-x:auto;padding:0 calc(var(--mx) - 7px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:var(--tap);border:7px solid transparent;background-clip:padding-box;padding:0 14px;border-radius:24px;font-size:calc(15px*var(--ts));font-weight:500;background-color:var(--fill);color:var(--lb);white-space:nowrap;margin:0 2px}
.chip.on{background-color:var(--inv-bg);color:var(--inv-tx)}
.seg{display:flex;margin:0 var(--mx) 8px;border-radius:18px;background:var(--fill);height:var(--tap)}
.seg button{flex:1;height:var(--tap);border:4px solid transparent;background-clip:padding-box;border-radius:18px;text-align:center;font-size:calc(15px*var(--ts));font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.seg button.on{background-color:var(--s1e);font-weight:600;box-shadow:var(--sh)}
:root[data-th=dark] .seg button.on{background-color:var(--s3)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 calc(var(--mx) - 10px) 4px}
.pnav button.l{flex:1;height:var(--tap);font-size:calc(17px*var(--ts));font-weight:600;text-align:center}
.nbtn{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--acc-tx);flex:none}
.nbtn.dis{opacity:.35}
/* buttons */
.bp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border-radius:25px;background:var(--acc-btn);color:var(--onacc);font-size:calc(17px*var(--ts));font-weight:600;text-align:center}
.bp.in{background:var(--in-btn);color:var(--white)}.bp.out{background:var(--out-btn);color:var(--white)}
.bs{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border-radius:25px;background:var(--acc-tint);color:var(--acc-tx);font-size:calc(17px*var(--ts));font-weight:600;text-align:center}
.bs.des{background:var(--fill);color:var(--out-tx)}
.btx{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:var(--tap);padding:0 10px;color:var(--acc-tx);font-weight:500;font-size:calc(17px*var(--ts))}
.btx.des{color:var(--out-tx)}
.swb{width:64px;height:var(--tap);display:flex;align-items:center;justify-content:flex-end;flex:none}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .2s ease-out;display:block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:var(--white);box-shadow:var(--sh-knob);transition:transform .2s ease-out}
.sw.on{background:var(--in)}.sw.on::after{transform:translateX(20px)}
.ckb{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;flex:none}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid var(--lb3);display:flex;align-items:center;justify-content:center;color:var(--onacc)}
.ck.on{background:var(--acc-btn);border-color:var(--acc-btn)}.ck .mi{font-size:18px}
/* forms: inset grouped rows */
.fr{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;position:relative;width:100%}
.fr>label.fl,.fr>.fl{flex:none;font-size:calc(17px*var(--ts));max-width:46%;display:flex;align-items:center;gap:8px}
.fr .fl .mi{color:var(--lb2);font-size:calc(20px*var(--ts))}
.fr input,.fr select{flex:1;height:48px;text-align:right;font-size:calc(17px*var(--ts));color:var(--lb);width:100%;-webkit-appearance:none;appearance:none}
.fr .pre{margin-left:auto}
.fr .pre+input{flex:0 1 auto;width:auto;field-sizing:content;min-width:2ch;max-width:60%}
.fr input::placeholder,.fr textarea::placeholder{color:var(--lb2)}
.fr select{direction:rtl;padding-right:0}
.fr select option{direction:ltr}
.fr:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
.fr.err{box-shadow:inset 0 0 0 2px var(--out)}
.fr.ro input{color:var(--lb2)}
.fr.ta{flex-direction:column;align-items:stretch;padding:12px 16px;gap:4px}
.fr.ta textarea{width:100%;resize:none;font-size:calc(17px*var(--ts));min-height:60px}
.fr .sfx{display:flex;align-items:center;flex:none}
.fh{padding:6px calc(var(--mx) + 16px) 12px;font-size:calc(13px*var(--ts));color:var(--lb2)}
.fh.err{color:var(--out-tx)}
.ftl{padding:16px calc(var(--mx) + 16px) 6px;font-size:calc(13px*var(--ts));color:var(--lb2);text-transform:uppercase;letter-spacing:.02em}
/* metric cards, ring, charts */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin:0 var(--mx) var(--gap)}
.mgrid .card{margin:0;padding:14px;min-width:0}
.mc .mh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc .mh b{font-size:calc(15px*var(--ts));font-weight:600}
.mc .cc{width:24px;height:24px;border-radius:12px;background:var(--fill2);display:flex;align-items:center;justify-content:center;color:var(--lb2);flex:none}
.mc .cc .mi{font-size:16px}
.mc .mv{margin-top:10px;font-size:calc(26px*var(--ts));font-weight:700;letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.mc .ms{margin-top:6px;color:var(--lb2);font-size:calc(13px*var(--ts))}
.dt{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.fit.in{display:inline-block;vertical-align:bottom;max-width:100%;min-width:0}
.r1>b:last-child,.ri>.fit,.ri>b>.fit,.gh>span:last-child{flex:0 0 auto;min-width:0;max-width:58%}
.gh>span:first-child{flex:1 1 0;min-width:0}
.pillsm{white-space:normal;overflow-wrap:anywhere;max-width:100%}
.ri .tt{overflow-wrap:anywhere}
.fit{display:block;white-space:nowrap;overflow:hidden;max-width:100%;cursor:pointer}
.ftiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin:0 var(--mx) var(--gap)}
.ftiles .card{margin:0;padding:12px 10px;min-width:0}
.ftiles .fv{font-size:calc(17px*var(--ts));font-weight:600;margin-top:4px;white-space:nowrap}
.ring svg{display:block}
.ring .rp{transition:stroke-dashoffset .9s ease-out;animation:ring .9s ease-out}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;transform-origin:bottom;animation:grow .5s ease-out;display:block;min-height:3px}
.legend{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
.legend .lg{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 40%}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
.chart{position:relative;touch-action:none;cursor:crosshair}
.chart svg{display:block;width:100%;height:150px;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;font-size:calc(12px*var(--ts));background:var(--s3);border-radius:8px;padding:3px 8px;display:none;white-space:nowrap;transform:translateX(-50%)}
.xl{display:flex;justify-content:space-between;color:var(--lb2);font-size:calc(11px*var(--ts));margin-top:2px}
/* category tiles (browse pattern) */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin:0 var(--mx) var(--gap)}
.ctile{border-radius:28px;padding:16px;min-height:150px;color:var(--on-tile);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer;min-width:0}
.ctile .mi{font-size:calc(30px*var(--ts));opacity:.85}
.ctile b{font-size:calc(17px*var(--ts));font-weight:600;display:block}
.ctile small{display:block;font-size:calc(13px*var(--ts));opacity:.85}
.ctile .tv{font-size:calc(19px*var(--ts));font-weight:700;margin-top:2px;white-space:nowrap}
.g-diesel{background:linear-gradient(135deg,var(--c-diesel),color-mix(in srgb,var(--c-diesel) 62%,var(--white)))}
.g-pvc{background:linear-gradient(135deg,var(--c-pvc),color-mix(in srgb,var(--c-pvc) 62%,var(--white)))}
.g-bit{background:linear-gradient(135deg,var(--c-bit),color-mix(in srgb,var(--c-bit) 62%,var(--white)))}
.g-hammer{background:linear-gradient(135deg,var(--c-ham),color-mix(in srgb,var(--c-ham) 62%,var(--white)))}
.g-other{background:linear-gradient(135deg,var(--c-oth),color-mix(in srgb,var(--c-oth) 62%,var(--white)))}
/* swipe rows */
.swp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%}
.swp::-webkit-scrollbar{display:none}
.swp>.main{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.swp>.act{flex:none;width:76px;scroll-snap-align:end;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:calc(13px*var(--ts));font-weight:600;min-height:var(--tap)}
.swp>.act.e{background:var(--acc-btn)}.swp>.act.d{background:var(--out-btn)}
.entry{display:block;padding:12px 16px;width:100%}
.entry .r1{display:flex;gap:8px;align-items:baseline}
.entry .r2{display:flex;gap:8px;margin-top:3px;color:var(--lb2);font-size:calc(13px*var(--ts));flex-wrap:wrap}
.pillsm{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:10px;font-size:calc(12px*var(--ts));font-weight:600;background:var(--fill)}
/* calendar */
.cal7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin:0 8px}
.cal7 .wd{text-align:center;color:var(--lb2);font-size:calc(12px*var(--ts));font-weight:600;padding:6px 0}
.cal7 .cd{aspect-ratio:.8;display:flex;flex-direction:column;align-items:center;padding-top:4px;border-radius:12px;position:relative;min-height:var(--tap)}
.cal7 .cd .n{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:calc(17px*var(--ts))}
.cal7 .cd.td .n{background:var(--acc-btn);color:var(--onacc);font-weight:600}
.cal7 .cd.sel .n{background:var(--fill2);color:var(--lb)}
.cal7 .cd.td.sel .n{background:var(--acc-btn);color:var(--onacc)}
.cal7 .cd .amt{font-size:calc(11px*var(--ts));color:var(--lb2);margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal7 .cd.has .amt{color:var(--acc-tx);font-weight:600}
.cal7 .cd.out{color:var(--lb2)}
/* misc */
.empty{text-align:center;padding:48px 32px;color:var(--lb2)}
.empty .mi{font-size:calc(52px*var(--ts));color:var(--lb3)}
.empty b{display:block;font-size:calc(20px*var(--ts));color:var(--lb);margin:10px 0 4px;font-weight:600}
.empty .bp{width:auto;padding:0 28px;margin:16px auto 0}
.errb{display:flex;gap:10px;align-items:flex-start;margin:0 var(--mx) var(--gap);padding:14px;border-radius:16px;background:var(--fill);color:var(--lb)}
.skel{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:8px}
.hlcard{margin:0 var(--mx) var(--gap);background:var(--s1);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.hlcard .hh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:calc(17px*var(--ts))}
.hlcard .hs{font-size:calc(17px*var(--ts));font-weight:500;margin:10px 0 12px;padding-bottom:12px;border-bottom:.5px solid var(--sep);line-height:1.3}
.bs2{display:flex;gap:8px;margin:0 var(--mx) var(--gap)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 var(--mx)}
.keys button{height:62px;border-radius:31px;background:var(--s3);font-size:calc(24px*var(--ts));text-align:center;display:flex;align-items:center;justify-content:center}
.keys button.op{background:var(--acc-btn);color:var(--onacc)}
.keys button.fn{background:var(--fill2)}
.strip3{display:flex;gap:8px;margin:0 var(--mx) var(--gap)}
.strip3>.card{flex:1;margin:0;padding:10px 8px;min-width:0}
.cstrip{position:absolute;top:var(--hdr);left:0;right:0;z-index:29;display:flex;align-items:center;gap:10px;padding:0 var(--mx);height:var(--tap);opacity:0;pointer-events:none;transition:opacity .2s ease-out}
.scr.hasstrip .nb::before{bottom:auto;height:calc(var(--hdr) + var(--tap))}
.scr.col .cstrip{opacity:1;pointer-events:auto}
.bot{position:absolute;left:0;right:0;bottom:0;padding:12px var(--mx) calc(var(--inset) + 12px);background:linear-gradient(to top,var(--canvas) 62%,transparent);z-index:20}
.bot .bs2{margin:0}
.live{margin:0 var(--mx) var(--gap);padding:16px;border-radius:var(--r);background:var(--s1);box-shadow:var(--sh);display:flex;gap:12px}
.live>div{flex:1;min-width:0}
.cstat{display:flex;margin:0 var(--mx) var(--gap);background:var(--s1);border-radius:var(--r);box-shadow:var(--sh)}
.cstat>div{flex:1;padding:12px 8px;text-align:center;min-width:0}
.cstat>div+div{border-left:.5px solid var(--sep)}
.cstat small{display:block;font-size:calc(12px*var(--ts));font-weight:600}
.cstat b{display:block;font-size:calc(16px*var(--ts));font-weight:700;margin-top:2px}
.pop{position:absolute;z-index:80;background:var(--s3);border-radius:12px;padding:8px 14px;font-weight:600;font-size:calc(15px*var(--ts));box-shadow:var(--sh-pop);animation:pop .15s ease-out}
/* needs-logic highlighter (dev panel) */
body.nl [data-nl]{outline:2px dashed var(--wrn);outline-offset:2px;position:relative}
body.nl [data-nl]::after{content:attr(data-nl);position:absolute;top:-10px;right:6px;background:var(--bal);color:var(--black);font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;z-index:9}
/* big text: stack two column grids */
body.tsbig .mgrid,body.tsbig .tgrid{grid-template-columns:1fr}
body.tsbig .ftiles{grid-template-columns:1fr 1fr}
body.tsbig .live{flex-direction:column}
body.tsbig .fr{flex-wrap:wrap;row-gap:0;padding-top:6px;padding-bottom:6px}
body.tsbig .fr>.fl{max-width:100%;flex:1 0 100%}
body.tsbig .fr input,body.tsbig .fr select{flex:1 0 100%;text-align:left;direction:ltr}
body.tsbig .fr .pre{margin-left:0}
body.tsbig .ri{flex-wrap:wrap}
body.tsbig .strip3{flex-direction:column}
/* v2.0.1: slim summary strip, feet drop down, commission strip and breakdown, scope pills */
.hscroll{overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pn2{display:flex;align-items:center;margin:0 calc(var(--mx) - 10px) 4px;flex-wrap:wrap}
.pn2 .pnav{flex:1 1 200px;margin:0;min-width:0}
.pn2 .pnav button.l{font-size:calc(15px*var(--ts));min-width:0;overflow:hidden;text-overflow:ellipsis}
.pn2 .rngl{flex:1 1 160px;min-width:0;padding:0 10px;font-weight:600}
.segs{display:flex;border-radius:18px;background:var(--fill);height:var(--tap);flex:none;margin:0 10px 0 4px}
.segs button{width:var(--tap);height:var(--tap);border:4px solid transparent;background-clip:padding-box;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--lb2)}
.segs button.on{background-color:var(--s1e);color:var(--lb);box-shadow:var(--sh)}
:root[data-th=dark] .segs button.on{background-color:var(--s3)}
.sumstrip{margin:0 var(--mx) var(--gap);background:var(--s1);border-radius:var(--r);box-shadow:var(--sh);display:flex}
.sumstrip>div{flex:none;min-width:calc(112px*var(--ts));padding:10px 14px}
.sumstrip>div+div{border-left:.5px solid var(--sep)}
.sumstrip .sl{display:flex;align-items:center;gap:4px;font-size:calc(12px*var(--ts));font-weight:500;color:var(--lb2);white-space:nowrap}
.sumstrip .sl .mi{font-size:calc(14px*var(--ts))}
.sumstrip .sv{font-size:calc(17px*var(--ts));font-weight:700;margin-top:3px;white-space:nowrap}
.feetbar{margin:0 var(--mx) var(--gap);background:var(--s1);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.feetbar>button{display:flex;align-items:center;gap:8px;width:100%;min-height:var(--tap);padding:6px 14px;font-size:calc(13px*var(--ts));font-weight:600}
.feetbar>button .sp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feetbar .fx{padding:0 14px 12px}
.feetbar .ft{font-size:calc(12px*var(--ts));font-weight:600;color:var(--lb2);margin:8px 0 4px}
.tch{display:flex;flex-wrap:wrap;gap:6px}
.tch span{display:inline-flex;gap:6px;align-items:baseline;padding:6px 10px;border-radius:10px;background:var(--fill);font-size:calc(12px*var(--ts));color:var(--lb2)}
.tch b{font-size:calc(13px*var(--ts));font-weight:600}
.cpvc{color:var(--c-pvc-tx)}.cms{color:var(--c-diesel-tx)}.coth{color:var(--c-oth-tx)}
.cmstrip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--com) 12%,transparent);font-size:calc(12px*var(--ts))}
.cmstrip .mi{font-size:calc(16px*var(--ts));color:var(--com-tx)}
.cmstrip .sp{text-align:right;color:var(--lb2);font-size:calc(11px*var(--ts))}
.cbk{margin:0 var(--mx) var(--gap);padding:12px 16px;border-radius:var(--r);background:var(--s1);box-shadow:var(--sh)}
.cbk .row{padding:4px 0}
.cbk hr{border:0;border-top:.5px solid var(--sep);margin:6px 0}
.mantag{display:inline-flex;margin-left:8px;padding:1px 8px;border-radius:10px;font-size:calc(12px*var(--ts));font-weight:600;background:color-mix(in srgb,var(--bal) 20%,transparent);color:var(--bal-tx)}
/* v2.0.2: bill lines, add line button, card chips, agent filter pill */
.ichip{display:inline-flex;align-items:center;gap:4px}
.ichip .mi{color:var(--lb2)}
.ichip b{font-weight:500;color:var(--lb)}
.fr.lnh>.fl{font-size:calc(13px*var(--ts));font-weight:600;color:var(--lb2);text-transform:uppercase;letter-spacing:.02em;max-width:none}
.addln{margin:-4px var(--mx) 8px;padding:0 10px 0 6px;gap:4px;justify-content:flex-start}
.pillb.on{background:var(--acc-tint);color:var(--acc-tx);box-shadow:inset 0 0 0 1px var(--acc)}
.pillb.on .mi,.pillb.on .l2{color:var(--acc-tx)}
.pillb.afp{margin-bottom:8px}
.scope{display:flex;margin:0 var(--mx) 4px;border-radius:28px;background:var(--acc-tint);padding:3px}
.scope button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:var(--tap);border-radius:25px;font-weight:600;font-size:calc(15px*var(--ts));color:var(--lb2)}
.scope button.on{background:var(--acc-btn);color:var(--onacc)}
.scope button .mi{font-size:calc(18px*var(--ts))}
.hint{padding:0 calc(var(--mx) + 8px) 10px}
.plink{display:flex;align-items:center;width:100%;min-height:var(--tap);border-top:.5px solid var(--sep)}
.plink .pm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:var(--tap);text-align:left;padding:10px 0}
/* v2.0.3: info icon button (opens the agent details sheet), agent view header, agent profit card, month table, agent bill card */
.agi{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);flex:none;border-radius:24px;color:var(--lb2)}
.agi:active{box-shadow:inset 0 0 0 100vmax var(--press)}
.agh{margin:0 var(--mx) var(--gap);padding:12px 8px 12px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--acc-btn),color-mix(in srgb,var(--acc-btn) 70%,var(--black)));color:var(--onacc)}
.agh .ah1{display:flex;align-items:center;gap:6px;min-height:var(--tap)}
.agh .ah1 .mi{font-size:calc(20px*var(--ts))}
.agh .ah1 b{flex:1;min-width:0;font-size:calc(20px*var(--ts));font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agh .agi{color:var(--onacc)}
.agh .ahp{font-size:calc(13px*var(--ts));margin-top:-4px}
.agh .ahl{font-size:calc(13px*var(--ts));margin-top:10px}
.agh .ahv{font-size:calc(34px*var(--ts));font-weight:700;letter-spacing:-.5px;line-height:1.1;padding-right:8px}
.agh .ahb{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);margin-top:4px;padding:0 14px 0 8px;border-radius:24px;font-weight:600;font-size:calc(15px*var(--ts));box-shadow:inset 0 0 0 1px var(--onacc)}
.agh .ahb:active{box-shadow:inset 0 0 0 1px var(--onacc),inset 0 0 0 100vmax var(--press)}
.agp{margin:0 var(--mx) var(--gap);padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--in) 10%,var(--s1));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--in) 35%,transparent)}
.agp.neg{background:color-mix(in srgb,var(--out) 10%,var(--s1));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--out) 35%,transparent)}
.agp .ahv{font-size:calc(28px*var(--ts));font-weight:700;letter-spacing:-.4px;line-height:1.1;margin:6px 0 8px}
.agp .t13+.t13{margin-top:2px}
.mtb .mr{display:grid;grid-template-columns:1.25fr .6fr 1.2fr 1.2fr;gap:8px;align-items:baseline;padding:8px 0;border-top:.5px solid var(--sep)}
.mtb .mr.th{border-top:0;padding:10px 0 4px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--lb2)}
.mtb .mr>span:not(:first-child){text-align:right;min-width:0}
.mtb .mr .fit{display:block;font-size:calc(13px*var(--ts));font-weight:600}

.agb{display:block;width:calc(100% - 2*var(--mx));margin:0 var(--mx) var(--gap);padding:14px 16px;background:var(--s1);border-radius:var(--r);box-shadow:var(--sh)}
.agb .r1{display:flex;align-items:center;gap:8px}
.agb .r1 .d{font-size:calc(13px*var(--ts));color:var(--lb2);flex:none}
.agb .r1 .ad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(15px*var(--ts))}
.agb .r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.agb.stk .r3{grid-template-columns:1fr}
.agb .r3 .t12{color:var(--lb2)}
.agb .r3 .fit{display:block;font-size:calc(14px*var(--ts));font-weight:600}
.agt{margin:0 var(--mx) var(--gap);padding:12px 16px;border-radius:var(--r);background:var(--acc-tint);display:flex;flex-wrap:wrap;gap:4px 16px;font-size:calc(14px*var(--ts))}
/* reduced motion */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

   o.compact: L (lakh) and Cr (crore) form, used only by fitAll() inside highlight tiles. */
function money(n,o){

 var v=Math.round(n*100)/100;if(v===0)v=0;
 var a=Math.abs(v),neg=v<0?'-':'',paise=Math.round(a*100)%100!==0;

  var c,u;

  return neg+RS+(Math.round(c*k)/k).toLocaleString('en-IN',{maximumFractionDigits:dec})+u;

}

 }else if(!on&&ST0){

function dev(kind,val){
 if(kind=='theme'){UI.theme=val;saveUI()}
 else if(kind=='accent'){UI.accent=val;saveUI()}
 else if(kind=='ts'){UI.ts=+val}
 else if(kind=='stress'){stressData(val=='on')}
 else if(kind=='dw'){UI.dw=+val;UI.dh=UI.dw==360?800:892}
 else if(kind=='nav'){UI.nav=val}
 else if(kind=='blur'){UI.blur=val=='on'}
 else if(kind=='kb'){UI.kbsim=val=='on'}
 else if(kind=='nl'){UI.nl=val=='on'}
 else if(kind=='state'){UI.state=val=='normal'?null:val}
 applyUI();render();buildSide();
}
function devRow(label,kind,opts,cur){
 return '<h2>'+label+'</h2><div class="dv">'+opts.map(function(o){return '<button class="'+(String(cur)==String(o[0])?'on':'')+'" onclick="dev(\''+kind+'\',\''+o[0]+'\')">'+o[1]+'</button>'}).join('')+'</div>';
}
